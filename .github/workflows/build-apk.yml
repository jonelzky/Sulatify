name: Build SULATIFY APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK with Cordova
        run: |
          npm install -g cordova
          cordova create temp com.jonelzky.sulatify SULATIFY
          cd temp
          cordova platform add android@12.0.1
          cp ../index.html www/index.html
          cp ../icon.png www/icon.png
          cp ../manifest.json www/manifest.json || true
          cordova build android -- --no-daemon
          mkdir -p ../apk
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../apk/SULATIFY_v1.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SULATIFY-APK
          path: apk/SULATIFY_v1.0.apk
